name: Build NumisRU APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find and extract ZIP archive
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort -V
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP archive found in repository root."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[${#ZIP_FILES[@]}-1]}"
          echo "Using source archive: $ZIP_FILE"

          mkdir -p source
          unzip -oq "$ZIP_FILE" -d source

          PUBSPEC="$(find source -name pubspec.yaml -type f -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml was not found in the ZIP archive."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix app version and Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import re
          import os
          import sys

          root = pathlib.Path(os.environ["PROJECT_DIR"])

          pubspec = root / "pubspec.yaml"
          pubspec_text = pubspec.read_text(encoding="utf-8")

          match = re.search(
              r"(?m)^version:\s*([^\s#]+)",
              pubspec_text
          )

          if not match:
              sys.exit("ERROR: version: was not found in pubspec.yaml")

          full_version = match.group(1)
          app_version = full_version.split("+", 1)[0]

          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", app_version):
              sys.exit(f"ERROR: Unexpected app version: {app_version}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"APP_VERSION={app_version}\n")

          print(f"App version: {app_version}")
          print(f"Pubspec version: {full_version}")

          # Keep appVersion after all Dart directives.
          main_dart = root / "lib" / "main.dart"

          if main_dart.exists():
              source = main_dart.read_text(encoding="utf-8")
              lines = source.splitlines()

              lines = [
                  line for line in lines
                  if not re.match(
                      r"^\s*(?:const\s+)?String\s+appVersion\s*=",
                      line
                  )
              ]

              last_directive = -1

              for index, line in enumerate(lines):
                  if re.match(
                      r"^\s*(import|export|part)\s",
                      line
                  ):
                      last_directive = index

              declaration = (
                  f"const String appVersion = "
                  f"String.fromEnvironment("
                  f"'APP_VERSION', defaultValue: '{app_version}');"
              )

              lines.insert(last_directive + 1, declaration)

              main_dart.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

              print("Updated lib/main.dart appVersion declaration.")
          else:
              print("WARNING: lib/main.dart not found; skipping appVersion patch.")

          android = root / "android"

          if not android.exists():
              sys.exit("ERROR: Android directory not found.")

          # Patch Android Gradle Plugin and Kotlin plugin versions.
          gradle_files = [
              android / "settings.gradle",
              android / "settings.gradle.kts",
              android / "build.gradle",
              android / "build.gradle.kts",
              android / "app" / "build.gradle",
              android / "app" / "build.gradle.kts",
              android / "gradle" / "libs.versions.toml",
          ]

          for path in gradle_files:
              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")
              original = text

              updated_lines = []

              for line in text.splitlines():
                  if "com.android.application" in line or \
                     "com.android.library" in line:
                      if "version" in line:
                          line = re.sub(
                              r'(version\s+)(["\'])[^"\']+\2',
                              r'\g<1>"8.11.1"',
                              line
                          )

                  if "com.android.tools.build:gradle:" in line:
                      line = re.sub(
                          r"(com\.android\.tools\.build:gradle:)[^'\"]+",
                          r"\g<1>8.11.1",
                          line
                      )

                  if "org.jetbrains.kotlin.android" in line or \
                     "kotlin-android" in line or \
                     "org.jetbrains.kotlin.jvm" in line:
                      if "version" in line:
                          line = re.sub(
                              r'(version\s+)(["\'])[^"\']+\2',
                              r'\g<1>"2.2.20"',
                              line
                          )

                  if "kotlin_version" in line or "kotlinVersion" in line:
                      line = re.sub(
                          r'(["\'])1\.[^"\']+\1',
                          '"2.2.20"',
                          line
                      )

                  if path.name == "libs.versions.toml":
                      if re.match(r'\s*agp\s*=', line):
                          line = re.sub(
                              r'=\s*["\'][^"\']+["\']',
                              '= "8.11.1"',
                              line
                          )
                      if re.match(r'\s*kotlin\s*=', line):
                          line = re.sub(
                              r'=\s*["\'][^"\']+["\']',
                              '= "2.2.20"',
                              line
                          )

                  updated_lines.append(line)

              updated = "\n".join(updated_lines) + "\n"

              # Also support old projects using ext.kotlin_version.
              if path.name == "build.gradle" and path.parent == android:
                  updated = re.sub(
                      r"(ext\.kotlin_version\s*=\s*['\"])[^'\"]+(['\"])",
                      r"\g<1>2.2.20\2",
                      updated
                  )

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Patched: {path.relative_to(root)}")

          # AGP 8.11.1 requires a compatible Gradle wrapper.
          wrapper = android / "gradle" / "wrapper" / "gradle-wrapper.properties"

          if wrapper.exists():
              text = wrapper.read_text(encoding="utf-8")
              text = re.sub(
                  r"distributionUrl=.*",
                  "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip",
                  text
              )
              wrapper.write_text(text, encoding="utf-8")
              print("Set Gradle wrapper to 8.13.")

          # Flutter uses build.gradle when both app Gradle files exist.
          # Remove the ignored Kotlin DSL duplicate to avoid ambiguity.
          groovy_app = android / "app" / "build.gradle"
          kotlin_app = android / "app" / "build.gradle.kts"

          if groovy_app.exists() and kotlin_app.exists():
              kotlin_app.unlink()
              print("Removed ignored duplicate android/app/build.gradle.kts.")

          print("Gradle compatibility patch completed.")
          PY

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define="APP_VERSION=${APP_VERSION}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NumisRU-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
