on:
  workflow_dispatch:
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            find "$SDK_ROOT" -maxdepth 6 \
              -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          NDK_PACKAGE="ndk;28.2.13676358"

          for attempt in 1 2 3; do
            echo "Installing $NDK_PACKAGE (attempt $attempt/3)"

            if { yes || true; } | "$SDKMANAGER" \
              --sdk_root="$SDK_ROOT" --install "$NDK_PACKAGE"; then
              exit 0
            fi

            rm -rf \
              "$SDK_ROOT/ndk/28.2.13676358" \
              "$SDK_ROOT/.temp" \
              "$HOME/.android/cache"

            sleep 5
          done

          echo "::error::NDK installation failed after 3 attempts"
          exit 1
