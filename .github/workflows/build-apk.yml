
name: Build NumisRU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest versioned ZIP
        id: archive
        run: |
          set -e
          ZIP_FILE="NumisRU_v0.79.3_TEST_austria-load-fix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -name 'NumisRU_v0.79.3_TEST_austria-load-fix*.zip' | sort | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "Fixed v0.79.3 ZIP not found"
            exit 1
          fi

          echo "Using $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        run: |
          set -e
          mkdir -p app
          unzip -q "${{ steps.archive.outputs.zip_file }}" -d app

          echo "Extracted files:"
          find app -maxdepth 3 -type f | head -n 80

      - name: Locate Flutter project
        id: flutter_project
        run: |
          set -e
          PROJECT_DIR=$(find app -type f -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter pubspec.yaml not found inside ZIP"
            exit 1
          fi

          echo "Flutter project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Flutter dependencies
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.flutter_project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NumisRU-APK
          path: ${{ steps.flutter_project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
