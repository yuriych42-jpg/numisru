
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find newest version ZIP
        id: archive
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys

          archives = glob.glob("*.zip")
          candidates = []

          for archive in archives:
              # Ищем версию вида 0.84.3 в любом имени ZIP.
              match = re.search(
                  r'(?i)(?:^|[^a-z0-9])v?(\d+(?:\.\d+)+)',
                  os.path.basename(archive)
              )
              if not match:
                  print(f"Skipping ZIP without version: {archive}")
                  continue

              version = tuple(int(part) for part in match.group(1).split("."))
              candidates.append((version, archive))

          if not candidates:
              print("ERROR: No root ZIP with a dotted version was found.")
              sys.exit(1)

          candidates.sort(key=lambda item: (item[0], item[1]))
          version, archive = candidates[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"zip_path={archive}\n")
              output.write(
                  "app_version=" + ".".join(map(str, version)) + "\n"
              )

          print(f"Selected ZIP: {archive}")
          print(f"Detected version: {'.'.join(map(str, version))}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p project
          unzip -q "${{ steps.archive.outputs.zip_path }}" -d project

          # Если ZIP содержит папку проекта внутри, находим pubspec.yaml.
          PUBSPEC=$(find project -name pubspec.yaml -type f -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release \
            --dart-define=APP_VERSION=${{ steps.archive.outputs.app_version }} \
            -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NumisRU-${{ steps.archive.outputs.app_version }}-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
