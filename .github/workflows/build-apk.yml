
name: Build NumisRU APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select source ZIP and extract project
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' \
            | grep -Ei 'numisru.*(code|version_sync)' \
            | sort -V \
            | tail -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Using source archive: $ZIP_FILE"
            mkdir -p "$RUNNER_TEMP/numisru-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/numisru-source"

            PROJECT_DIR="$(find "$RUNNER_TEMP/numisru-source" \
              -name pubspec.yaml -type f -print -quit \
              | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
              echo "::error::Could not find pubspec.yaml in the ZIP archive."
              exit 1
            fi
          elif [ -f pubspec.yaml ]; then
            echo "No matching ZIP found; using repository project."
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            echo "::error::No matching NumisRU ZIP and no root pubspec.yaml found."
            exit 1
          fi

          VERSION="$(python3 - "$PROJECT_DIR/pubspec.yaml" <<'
