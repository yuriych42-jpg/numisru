
name: Build NumisRU TEST APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        shell: bash
        run: |
          set -eux
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Extract NumisRU project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="NumisRU_v0.79.3_TEST_austria-load-fix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Archive not found: $ZIP_FILE"
            echo "ZIP files in repository root:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PUBSPEC="$(find extracted -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml was not found in the archive"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          echo "Project version:"
          grep -nE '^(name|version|environment):|sdk:' "$PUBSPEC" || true

      - name: Prepare Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f pubspec.yaml

          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            echo "::error::Android settings.gradle was not found"
            exit 1
          fi

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android app/build.gradle was not found"
            exit 1
          fi

          echo "=== Android settings.gradle ==="
          for f in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$f" ]; then
              cat "$f"
            fi
          done

          echo "=== Android app/build.gradle ==="
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              cat "$f"
            fi
          done

          mkdir -p android

          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          if ! grep -qE '^[[:space:]]*android\.newDsl[[:space:]]*=' android/gradle.properties; then
            printf '\nandroid.newDsl=false\n' >> android/gradle.properties
          else
            sed -i 's/^[[:space:]]*android\.newDsl[[:space:]]*=.*/android.newDsl=false/' android/gradle.properties
          fi

          chmod +x android/gradlew 2>/dev/null || true

          echo "=== Effective Gradle properties ==="
          cat android/gradle.properties

      - name: Generate Gradle wrapper if missing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle wrapper is missing; generating Android platform files."

            flutter create \
              --platforms=android \
              --org ru.numisru \
              --project-name numisru \
              --no-pub .

            rm -f android/settings.gradle.kts
            rm -f android/build.gradle.kts
            rm -f android/app/build.gradle.kts
          fi

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

          echo "=== Gradle wrapper version ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade Kotlin version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          roots = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle"),
              Path("android/build.gradle.kts"),
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          changed_files = []
          found_declaration = False

          for path in roots:
              if not path.exists():
                  continue

              original = path.read_text()
              lines = original.splitlines(keepends=True)
              updated_lines = []

              for line in lines:
                  new_line = line

                  is_kotlin_plugin = (
                      "org.jetbrains.kotlin.android" in line
                      or "kotlin-android" in line
                  )

                  is_kotlin_version_assignment = (
                      "kotlin_version" in line
                      or "kotlinVersion" in line
                  )

                  if is_kotlin_plugin and re.search(r"\bversion\b", line):
                      found_declaration = True
                      new_line = re.sub(
                          r'(\bversion\s*["\']?)[0-9]+\.[0-9]+\.[0-9]+(["\']?)',
                          r'\g<1>2.2.20\2',
                          line,
                      )

                  elif is_kotlin_version_assignment:
                      found_declaration = True
                      new_line = re.sub(
                          r'((?:kotlin_version|kotlinVersion)\s*=\s*["\'])[0-9]+\.[0-9]+\.[0-9]+(["\'])',
                          r'\g<1>2.2.20\2',
                          line,
                      )

                  updated_lines.append(new_line)

              updated = "".join(updated_lines)

              if updated != original:
                  path.write_text(updated)
                  changed_files.append(str(path))

          if not found_declaration or not changed_files:
              print(
                  "::error::Could not automatically update the Kotlin "
                  "version declaration to 2.2.20."
              )
              print("Gradle configuration files for diagnosis:")
              for path in roots:
                  if path.exists():
                      print(f"\n--- {path} ---")
                      print(path.read_text())
              sys.exit(1)

          print("Kotlin version updated to 2.2.20 in:")
          for path in changed_files:
              print(f" - {path}")
          PY

          echo "=== Kotlin plugin declarations after update ==="
          grep -R -nE \
            'org\.jetbrains\.kotlin\.android|kotlin-android|kotlin_version|kotlinVersion' \
            android --include='*.gradle' --include='*.gradle.kts' || true

      - name: Verify Android Gradle Plugin version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "=== Android Gradle Plugin declarations ==="
          grep -R -nE \
            'com\.android\.application.*version|com\.android\.tools\.build:gradle|android\.newDsl' \
            android --include='*.gradle' --include='*.gradle.kts' --include='*.properties' || true

          if [ -f android/settings.gradle ]; then
            SETTINGS="android/settings.gradle"
          elif [ -f android/settings.gradle.kts ]; then
            SETTINGS="android/settings.gradle.kts"
          else
            echo "::error::Android settings file is missing"
            exit 1
          fi

          if ! grep -Eq \
            'com\.android\.application.*version.*8\.11\.1|com\.android\.tools\.build:gradle:8\.11\.1' \
            "$SETTINGS" android/build.gradle android/build.gradle.kts 2>/dev/null; then
            echo "::error::Expected Android Gradle Plugin 8.11.1 was not found."
            echo "Check the Gradle plugin version before building."
            exit 1
          fi

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$SDK_ROOT/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            find "$SDK_ROOT" -maxdepth 6 \
              -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          NDK_PACKAGE="ndk;28.2.13676358"

          for attempt in 1 2 3; do
            echo "Installing $NDK_PACKAGE (attempt $attempt/3)"

            if { yes || true; } | "$SDKMANAGER" \
              --sdk_root="$SDK_ROOT" --install "$NDK_PACKAGE"; then
              exit 0
            fi

            rm -rf \
              "$SDK_ROOT/ndk/28.2.13676358" \
              "$SDK_ROOT/.temp" \
              "$HOME/.android/cache"

            sleep 5
          done

          echo "::error::NDK installation failed after 3 attempts"
          exit 1

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk --release -v

          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK was not produced"
            exit 1
          fi

          echo "=== APK file ==="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NumisRU-v0.79.3-TEST-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
